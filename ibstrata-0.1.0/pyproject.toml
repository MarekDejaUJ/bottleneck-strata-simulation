[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "ibstrata"
version = "0.1.0"
description = "Information-bottleneck strata for bounds on probabilities of causation from combined experimental and observational data"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Marek Deja", email = "marek.deja@uj.edu.pl" }]
requires-python = ">=3.10"
keywords = [
    "probabilities of causation",
    "probability of necessity and sufficiency",
    "partial identification",
    "information bottleneck",
    "causal inference",
    "survey methodology",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.11",
    "pandas>=2.0",
    "networkx>=3.0",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
test = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6"]

[project.urls]
Homepage = "https://github.com/MarekDejaUJ/ibstrata"

[tool.hatch.build.targets.wheel]
packages = ["src/ibstrata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
ignore = ["B905", "B007"]

[tool.ruff.lint.isort]
known-first-party = ["ibstrata"]
